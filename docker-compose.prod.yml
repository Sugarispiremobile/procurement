# Продакшн: app + db + Caddy (автоматический HTTPS). Настройки — в корневом файле .env (см. .env.prod.example).
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: procurement
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports не публикуются: база доступна только внутри сети compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://procurement:${POSTGRES_PASSWORD}@db:5432/procurement
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET}
      APP_URL: https://${DOMAIN:?задайте DOMAIN}
      TRUST_PROXY: "1"
      PORT: "3000"
      CURRENCY: ${CURRENCY:-₸}
      APP_TZ: ${APP_TZ:-Asia/Almaty}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Заявки в снабжение <no-reply@localhost>}
    volumes:
      - uploads:/data/uploads
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: procurement
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: procurement
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "-c", "while true; do bash /backup.sh; sleep 86400; done"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
