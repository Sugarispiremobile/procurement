# Локальная база данных для разработки: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procurement}
      POSTGRES_DB: procurement
    ports:
      - "127.0.0.1:5433:5432"   # только локально; не открывайте базу в интернет
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
