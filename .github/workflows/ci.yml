name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: procurement, POSTGRES_PASSWORD: procurement, POSTGRES_DB: procurement_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procurement" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    env:
      TEST_DATABASE_URL: postgres://procurement:procurement@localhost:5432/procurement_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: procurement, POSTGRES_PASSWORD: procurement, POSTGRES_DB: procurement_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U procurement" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://procurement:procurement@localhost:5432/procurement_e2e
      JWT_SECRET: ci-e2e-secret-ci-e2e-secret-ci-e2e-secret
      SEED_DEMO: "1"
      ADMIN_PASSWORD: ci-admin-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci && npm run build
        working-directory: client
      - run: npm ci && npm run db:setup
        working-directory: server
      - run: npm install && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
  docker:
    runs-on: ubuntu-latest
    needs: [server, client, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t procurement .
